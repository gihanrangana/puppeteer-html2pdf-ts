<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PDF Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: 'Imperial Script', sans-serif;
                line-height: 1.6;
                color: #333;
                padding: 40px;
            }
            header {
                border-bottom: 3px solid #007bff;
                margin-bottom: 30px;
                padding-bottom: 20px;
            }
            h1 {
                font-family: 'Audiowide', sans-serif;
                color: #007bff;
                margin-bottom: 10px;
            }
            .subtitle {
                color: #666;
                font-size: 14px;
            }
            section {
                margin-bottom: 30px;
            }
            h2 {
                color: #0056b3;
                font-size: 18px;
                margin-bottom: 15px;
                border-left: 4px solid #007bff;
                padding-left: 10px;
            }
            .content {
                font-size: 14px;
                line-height: 1.8;
            }
            footer {
                width: 100%;
                margin-top: 40px;
                padding-top: 20px;
                border-top: 1px solid #ddd;
                font-size: 12px;
                color: #999;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div id="content"></div>
    </body>
</html>
